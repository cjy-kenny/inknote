name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: ""
            args: ""
          - name: Linux x64
            platform: ubuntu-22.04
            target: ""
            args: ""
          - name: macOS arm64
            platform: macos-14
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - name: macOS x64
            platform: macos-13
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux WebView dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "InkNote ${{ github.ref_name }}"
          releaseBody: "InkNote 是一个安静、克制、完全本地的 Markdown 记事本。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Create Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "portable" | Out-Null
          Copy-Item "src-tauri/target/release/InkNote.exe" "portable/InkNote.exe"
          Copy-Item "scripts/InkNote-Portable.cmd" "portable/InkNote-Portable.cmd"
          Compress-Archive -Path "portable/*" -DestinationPath "InkNote-Windows-Portable.zip" -Force
      - name: Upload portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "InkNote-Windows-Portable.zip" --clobber
