[package]
name = "inknote"
version = "0.1.0"
description = "A quiet, local-first Markdown notebook."
authors = ["InkNote"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/cjy-kenny/inknote"

[lib]
name = "inknote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
